# 本文件的工作目录是在用户根目录，本目录携带是因为如果放外面就会更新的时候覆盖你的修改，因此我只能藏起来。
# 如果没有按初始化说明进行初始化那么你需要手动复制本文件到上层目录，请知悉。
patch:
  speller/algebra:
    __patch:
      - wanxiang_algebra:/pro/小鹤双拼
      - wanxiang_algebra:/pro/直接辅助
  "switches/@0/reset": 1  # 默认英文
  "menu/page_size": 6
  # __patch:
  #     "key_binder/bindings":
  #       __patch:
  #         - "key_bindings:/emacs_editing"
  # + 追加尾部 ^插入头部
  key_binder/bindings/+:
    - { when: always, accept: Shift_R, toggle: full_shape } # Shift_R 切换全半角
    - { when: composing, accept: "-", send: Page_Up }
    - { when: composing, accept: "=", send: Page_Down }
    - { when: has_menu, accept: Tab, send: space }
    # emacs
    - { accept: "Control+p", send: Up, when: has_menu }
    - { accept: "Control+n", send: Down, when: has_menu }
    - { accept: "Control+b", send: Left, when: has_menu }          # 移动单个字母（向左）
    - { accept: "Control+f", send: Right, when: has_menu }         # 移动单个字母（向右）
    - { accept: "Control+a", send: Home, when: has_menu }
    - { accept: "Control+e", send: End, when: has_menu }
    - { accept: "Control+d", send: Delete, when: composing }
    - { accept: "Control+k", send: "Shift+Delete", when: composing }
  super_sequence:  # Lua 配置：手动排序的快捷键 super_sequence.lua，不要用方向键，各种冲突，一定要避免冲突
    db_name: "sequence"
    up: "noop"  # 上移
    down: "noop"  # 下移
    reset: "noop"  # 重置
    pin: "noop"  # 置顶
  # editor/bindings/Tab: confirm                       # Tab 键上屏
  # 2. 中英文与 CapsLock 行为
  ascii_composer/switch_key:
    Shift_L: commit_code                             # 左 Shift 切换中英文 禁用noop
  good_old_caps_lock: false                          # 禁用 Caps 切换中英文
  # 4. 标点符号设置
  punctuator:
    full_shape: []
    half_shape: []
