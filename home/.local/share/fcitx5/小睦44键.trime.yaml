# 预编辑（编码区）
preedit:
  horizontal_padding: 11 #横向内边距（整数）
  alpha: 0.8 #不透明度（0-1，浮点）
  top_end_radius: 8 #右上方圆角（浮点）
  foreground: #前景样式
    font_size: 18 #字号（浮点）

# 候选窗口
window:
  insets: #窗口内边距
    vertical: 3 #纵向内边距（整数）
    horizontal: 3 #横向内边距（整数）
  item_padding: #候选项内边距
    vertical: 2 #纵向内边距（整数）
    horizontal: 4 #横向内边距（整数）
  min_width: 5 #最小宽度（整数）
  corner_radius: 6 #圆角半径（浮点）
  alpha: 1 #透明度（0-1，浮点）
  foreground: #前景样式
    label_font_size: 21 #序号字号（浮点）
    text_font_size: 21 #候选字号（浮点）
    comment_font_size: 18 #提示字号（浮点）
