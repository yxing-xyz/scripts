liquid_keyboard:
  # 目前只能直接写参数，不支持变量或者fallback机制。
  row: 4              #每屏最多显示多少行按键
  row_land: 5         #横屏每屏最多显示多少行按键
  key_height: 40      #按键高度
  key_height_land: 40 #横屏模式按键高度
  single_width: 55    #single类型的按键宽度
  vertical_gap: 0     #纵向按键间隙
  margin_x: 4         #左右按键间隙的1/2
  fixed_key_bar:  # 固定按键条
    position: bottom  # 摆放位置（在滚动区域的……） top|bottom|left|right
    keys:  # 按键（显示名称为对应的label，不能放太多）
      - liquid_keyboard_exit
      - ief
      - Left
      - cilpboard_window
      - Right
      - BackSpace
      - Return
  keyboards: [history, ascii, cn, emoji, URL, email, zhuyin, list, jpn, math, unit, symbol, tabs]
  tabs:
    name: 更多
    type: TABS
  history:
    name: 常用
    type: HISTORY
  emoji:
