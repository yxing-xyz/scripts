preset_keyboards:
  default:
    landscape_keyboard: landscape_default
    name: 26键
    label_transform: uppercase   #键盘字母转化为大写
    lock: false #切换程序时记忆键盘
    __patch:
      - 锚点/26键
    keys:
      # 数字行
      - {click: 1, long_click: ^1, __include: 锚点/数顶}
      - {click: 2, long_click: ^2, __include: 锚点/数顶}
      - {click: 3, long_click: ^3, __include: 锚点/数顶}
      - {click: 4, long_click: ^4, __include: 锚点/数顶}
      - {click: 5, long_click: ^5, __include: 锚点/数顶}
      - {click: 6, long_click: ^6, __include: 锚点/数顶}
      - {click: 7, long_click: ^7, __include: 锚点/数顶}
      - {click: 8, long_click: ^8, __include: 锚点/数顶}
      - {click: 9, long_click: ^9, __include: 锚点/数顶}
      - {click: 0, long_click: ^0, __include: 锚点/数顶}
      # 第 1 行
      - {click: 'q', long_click: ';', __include: 小睦.yaml:/Q}
      - {click: 'w', long_click: '@', __include: 小睦.yaml:/w}
      - {click: 'e', long_click: '+', key_symbol_offset_y: -1, __include: 小睦.yaml:/E}
