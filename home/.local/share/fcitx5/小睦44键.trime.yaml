# Trime style settings
# encoding: utf-8

name: 小睦44键 #方案名称

锚点:
  数顶:
    height: 35
    __include: 小睦.yaml:/顶部0-9

  26键:
    ascii_mode: 0 #默认中/英状态
    width: 10
    height: 40
    horizontal_gap: 2 #按键水平间距
    vertical_gap: 5 #5/1｜按键行距
    key_symbol_offset_x: 9.5 #上符x
    key_symbol_offset_y: 1

  横屏26:
    width: 4.5
    height: 20
    vertical_gap: 1
    __include: 锚点/26键

  九键数字:
    width: 22
    height: 40
    key_symbol_offset_x: 0
    vertical_gap: 1
    __include: 锚点/26键

  编辑:
    width: 22
    height: 28
    horizontal_gap: 3
    vertical_gap: 1
    key_text_size: 17 #按键字大小
    __include: 锚点/26键

  主题:
    ascii_mode: 1
    vertical_gap: 3
    key_text_offset_y: -1 # 字y
    key_symbol_offset_x: 0 # 上符x
    key_symbol_offset_y: 1 # 上符y
    key_hint_offset_y: -4.5 # 下符y
    __include: 锚点/26键
  主题0-9:
    height: 33
    __include: 小睦.yaml:/顶部0-9

  调频:
    width: 25
    height: 40
    __include: 锚点/26键

  集成:
    ascii_mode: 0
    width: 25
    height: 25
    vertical_gap: 15
    horizontal_gap: 25
    key_text_offset_y: -6
    key_hint_offset_y: -7
  集成附加:
    key_text_size: 33
    __include: 小睦.yaml:/透明

  底栏:
    height: 15
    width: 13
    key_text_offset_y: 0.5
    __include: 小睦.yaml:/透明
  底栏左侧:
    width: 15.8
    __include: 锚点/底栏
    key_text_offset_x: 10
  底栏右侧:
    __include: 锚点/底栏左侧
    key_text_offset_x: -10
  底栏箭头:
    width: 14.6
    __include: 锚点/底栏


style:
  keyboard_height: 275 #锁定键盘高度，避免切换时键盘高度变化而造成闪烁
  keyboard_height_land: 210 #锁定横屏下键盘高度，避免切换时键盘高度变化而造成闪烁
  keyboard_padding: 2 #竖屏模式下，屏幕左右两侧与键盘的距离
  keyboard_padding_bottom: 6 #竖屏模式下，屏幕下边缘与键盘的距离
  keyboard_padding_land: 20 #横屏模式下，屏幕左右两侧与键盘的距离
  keyboard_padding_land_bottom: 5 #横屏模式下，屏幕下侧与键盘的距离
  reset_ascii_mode: false #显示键盘时重置为中文状态
  auto_caps: false #自动句首大写:true|false|ascii
  latin_locale: en_US #西文语言
  locale: zh_CN #预设语言 zh_TW,zh_CN,zh_HK,""
  background_dim_amount: 0.5 #备用参数，无功能
  keyboards: #键盘配置：自动键盘、字母、数字
    - .default
    - default
    - letter
    - number
    - editor
    - theme_editor
    - theme²
    - tp_keyboard
    - layout

  # 候选区
  ## 候选
  candidate_use_cursor: true #高亮候选项
  candidate_view_height: 22 #候选区高度
  candidate_padding: 5 #候选项内边距
  candidate_spacing: 0.5 #候选间距
  candidate_corner_radius: 8 # 高亮背景首选圆角
  candidate_font: [LXGWWenKai-Medium.ttf] #候选字型
  candidate_text_size: 21 #候选字号
  ## 编码
  comment_height: 22 #编码提示区高度
  comment_font: [seguiemj.ttf] #编码提示字型
  comment_text_size: 12 #编码提示字号
  comment_position: overlay #编码提示布局位置：right / top / overlay
  candidate_text_vertical_bias: 0.5 #候选文本垂直偏移位置（仅 overlay 模式使用，需要间隙空间足够，范围 0.0~1.0，0.0=top，0.5=center，1.0=bottom）
  comment_vertical_bias: 0.0 #编码提示垂直偏移位置（仅 overlay 模式使用，需要间隙空间足够，范围 0.0~1.0，0.0=top，0.5=center，1.0=bottom）

  # 按键区
  proximity_correction: true #按键纠错
  vertical_correction: -5 #按键偏移（上偏为正）
  horizontal_gap: 5 #键水平间距
  vertical_gap: 2 #键盘行距
  ## 主按键
  key_height: 26 #键高
  key_width: 12 #键宽，占屏幕宽的百分比
  round_corner: 10 #按键圆角半径
  shadow_radius: 0 #按键阴影半径
  key_border: 0 #按键边框
  key_font: [LXGWWenKai-Medium.ttf, iconfont.ttf] #键盘字型
  latin_font: LXGWWenKai-Medium.ttf #西文字型
  hanb_font: [LXGWWenKai-Medium.ttf, seguiemj.ttf, PlangothicP1-Regular.ttf, PlangothicP2-Regular.ttf] #扩充字型
  key_text_size: 20 #键字号
  key_long_text_size: 16 #长标签字号
  symbol_font: [iconfont.ttf] #符号字型
  symbol_text_size: 10 #符号字号
  ## 气泡弹窗
  popup_text_size: 36 #气泡弹窗字号
  popup_font: [iconfont.ttf] #气泡弹窗字体
  popup_width: 38 #气泡弹窗宽度
  popup_height: 44 #气泡弹窗高度
  popup_bottom_margin: 58 #气泡弹窗底边距
  popup_key_height: 44 #气泡弹窗内键高度
  popup_text_size: 23 #气泡弹窗字号

tool_bar: #工具栏
  button_spacing: 17 # 按钮间距
  button_font: [iconfont.ttf] # 按钮字体
  # 左侧固定主按钮配置
  primary_button:
    # 背景样式设置
    background:
      type: circle           # 高亮形状 (可选值: circle|rectangle)
      corner_radius: 10      # 圆角半径
      normal: 0x00        # 正常状态背景颜色
      highlight: 0x00  # 高亮状态背景色
      vertical_inset: 4      # 垂直方向内缩量
      horizontal_inset: 0    # 水平方向内缩量
    # 前景内容设置
    foreground:
      font_size: 20 #按键大小
      style: "\uE12F" #样式
      normal: 非首选字色  # 正常状态前景色 (本地图片不允许着色)
      # highlight:        # 高亮状态前景色
      padding: 8            # 前景内容与背景边界的内边距
      size: [40, 65]      # 视图控件宽高，非前景样式宽高
    # 按钮点击事件
    action: menu_keyboard

# 收起
  hide_button: &hide_button
    background:
      highlight: 0x00
    foreground:
      font_size: 10.7
      style: "ic@chevron-down"
      size: [40, 54]
    action: Hide

  # 语音
  yy_button: &yy_button
    foreground:
      font_size: 23
      style: "\uE180"
      padding: 7
    action: YY

# 键盘选择
  layout_button: &layout_button
    foreground:
      font_size: {__include: /tool_bar/yy_button/foreground/font_size}
      style: "\uE101"
      padding: 7
    action: keyboard_layout

# 编辑
  edit_button: &edit_button
    foreground:
      font_size: {__include: /tool_bar/yy_button/foreground/font_size}
      style: "\uE1C0"
    action: Keyboard_editor

  #🔴重做：
  redo_button: &redo_button
    foreground:
      font_size: {__include: /tool_bar/yy_button/foreground/font_size}
      style: "ic@redo"
    action: xb

  #🔴撤销：
  undo_button: &undo_button
    foreground:
      font_size: {__include: /tool_bar/yy_button/foreground/font_size}
      style: "ic@undo"
    action: sb

# 顺序（右→左）
  buttons: [ *hide_button, *yy_button, *edit_button, *layout_button, *redo_button, *undo_button ]


fallback_colors:
  __include: 小睦.yaml:/fallback_colors

preset_color_schemes:
  __include: 小睦.yaml:/preset_color_schemes

android_keys:
  # 仅供编辑键盘时参考，实际不产生任何效果
  when:
    ascii: 西文標籤
    paging: 翻頁標籤
    has_menu: 選單標籤
    composing: 輸入狀態標籤
    #always: 始終
    #hover: 滑過
    combo: 並擊
    click: 單按
    long_click: 長按
    #double_click: 雙按
    swipe_left: 左滑
    swipe_right: 右滑
    swipe_up: 上滑
    swipe_down: 下滑
  property:
    width: 寬度
    height: 高度
    gap: 間隔
    preview: 預覽
    hint: 提示
    label: 標籤
    states: 狀態標籤
    repeatable: 連續按鍵
    functional: 功能鍵
